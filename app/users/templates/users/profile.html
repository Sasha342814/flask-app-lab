{% extends 'base.html' %}

{% block content %}
<div class="profile-wrap theme-{{ theme }}">
    <h2>Вітаємо, {{ username }}!</h2>

    <div class="mb-4 d-flex flex-wrap gap-2 align-items-center">
        <span>Кольорова схема:</span>
        <a class="btn btn-sm btn-outline-secondary {% if theme == 'light' %}active{% endif %}"
           href="{{ url_for('users.set_theme', name='light') }}">☀ Світла</a>
        <a class="btn btn-sm btn-outline-secondary {% if theme == 'dark' %}active{% endif %}"
           href="{{ url_for('users.set_theme', name='dark') }}">🌙 Темна</a>
        <form method="post" action="{{ url_for('users.logout') }}" class="ms-auto">
            <button type="submit" class="btn btn-danger btn-sm">Вийти</button>
        </form>
    </div>

    <div class="row g-4">
        <section class="col-md-5">
            <h3 class="h5">Додати кукі</h3>
            <form method="post" action="{{ url_for('users.add_cookie') }}" class="mb-4">
                <div class="mb-2"><input class="form-control" name="key" placeholder="Ключ" required></div>
                <div class="mb-2"><input class="form-control" name="value" placeholder="Значення"></div>
                <div class="mb-2"><input class="form-control" type="number" min="1" name="max_age"
                                         placeholder="Термін дії, секунд (порожньо — до закриття браузера)"></div>
                <button class="btn btn-success">Додати</button>
            </form>

            <h3 class="h5">Видалити кукі</h3>
            <form method="post" action="{{ url_for('users.delete_cookie') }}" class="mb-2 d-flex gap-2">
                <input class="form-control" name="key" placeholder="Ключ" required>
                <button class="btn btn-warning">Видалити</button>
            </form>
            <form method="post" action="{{ url_for('users.delete_all_cookies') }}">
                <button class="btn btn-outline-danger">Видалити всі</button>
            </form>
        </section>

        <section class="col-md-7">
            <h3 class="h5">Поточні кукі</h3>
            <table class="table table-bordered align-middle">
                <thead><tr><th>Ключ</th><th>Значення</th></tr></thead>
                <tbody>
                {% for key, value in cookies.items() %}
                    <tr><td>{{ key }}</td><td class="text-break">{{ value }}</td></tr>
                {% else %}
                    <tr><td colspan="2" class="text-center text-muted">Кукі відсутні</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </section>
    </div>
</div>
{% endblock %}
