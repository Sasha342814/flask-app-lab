{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h2 class="card-title">{{ product.name }}</h2>
        <p class="text-muted">ID: {{ product.id }}</p>
        <p class="card-text">{{ product.content }}</p>
        <p class="fs-4 fw-bold">Ціна: {{ product.price }} $</p>
        <a href="{{ url_for('products.products_list') }}" class="btn btn-outline-secondary">← До списку</a>
    </div>
</div>
{% endblock %}
