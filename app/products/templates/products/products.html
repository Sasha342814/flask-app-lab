{% extends 'base.html' %}

{% block content %}
<div class="row g-4">
    {% for p in products %}
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-body">
                <h2 class="h5 card-title">{{ p.name }}</h2>
                <p class="card-text">{{ p.content }}</p>
                <p class="fw-bold">{{ p.price }} $</p>
            </div>
            <div class="card-footer bg-transparent border-0">
                <a href="{{ url_for('products.detail_product', product_id=p.id) }}" class="btn btn-primary">Детальніше</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
