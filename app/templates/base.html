<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Flask Blog" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark" style="background:#5f7a91">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.home') }}">Flask Blog</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{{ url_for('main.home') }}">Home</a>
      <a class="nav-link" href="{{ url_for('main.about') }}">About</a>
    </div>
    <div class="navbar-nav">
      {% if current_user.is_authenticated %}
        <a class="nav-link" href="{{ url_for('users.users_list') }}">Users</a>
        <a class="nav-link" href="{{ url_for('users.account') }}">Account</a>
        <a class="nav-link" href="{{ url_for('users.logout') }}">Logout</a>
      {% else %}
        <a class="nav-link" href="{{ url_for('users.login') }}">Login</a>
        <a class="nav-link" href="{{ url_for('users.register') }}">Register</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container mt-4" style="max-width: 720px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
