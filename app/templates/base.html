<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blog{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .tag-link { color: #f0a500; text-decoration: none; font-weight: 600; }
    .tag-link:hover { color: #c78500; text-decoration: underline; }
    .post-title { color: #f28c1c; }
  </style>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('posts.index') }}">Blog</a>
    <a class="btn btn-primary btn-sm" href="{{ url_for('posts.add_post') }}">Add post</a>
  </div>
</nav>
<div class="container" style="max-width: 760px;">
  {% block content %}{% endblock %}
</div>
</body>
</html>
