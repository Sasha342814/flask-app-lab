    <section class="col-md-7">
        <h2>Написати повідомлення</h2>
        <form method="post" action="{{ url_for('contacts') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Ім'я</label>
                <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    required
                />
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required
                />
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Повідомлення</label>
                <textarea
                    class="form-control"
                    id="message"
                    name="message"
                    rows="4"
                    required
                ></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Надіслати</button>
        </form>
    </section>
</div>
